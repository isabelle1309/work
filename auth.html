<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../style/auth.css">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boobbandit GmbH login page</title>
</head>
<body>
    <div class="container">

        <div class="row justify-content-center align-items-center vh-100 px-3">

            <div class="col-12 col-sm-10 col-md-6 col-lg-4">

                <div class="card shadow-sm p-4 border-0">

                    <h3 class="mb-4 text-center">evil ass login page</h3>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input id="email" type="email" class="form-control form-control-lg" placeholder=" ">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input id="password" type="password" class="form-control form-control-lg" placeholder=" ">
                    </div>

                    <button id="loginBtn" class="btn btn-primary btn-lg w-100">
                        lock in
                    </button>

                    <div id="errorMsg" class="text-danger mt-3 text-center small"></div>

                </div>

            </div>

        </div>

    </div>
</body>
<script type="module" src="../script/login.js"></script>

</html>
