<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barcodes</title>

    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style/barcodes.css">

    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script type="module" src="script/barcodes.js"></script>
    <script type="module" src="script/barcodes-auth.js"></script>
</head>

<body>
    <nav id="appNavbar" class="navbar navbar-expand-lg navbar-dark custom-navbar" hidden>
        <div class="container">
            <a href="homepage.html" class="navbar-brand">
                <i class="bi bi-house-fill"></i> Miau GmbH
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="timetracker.html">
                            <i class="bi bi-clock-history"></i> Time tracker
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html">
                            <i class="bi bi-calendar3"></i> Calendar
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="lokaliseren.html">
                            <i class="bi bi-box-seam"></i> Lokaliseren
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="barcodes.html" aria-current="page">
                            <i class="bi bi-upc-scan"></i> Barcodes
                        </a>
                    </li>
                </ul>

                <button class="btn btn-outline-light" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-lg-5">

        <div class="barcode-workspace">
            <section class="barcode-controls" aria-labelledby="barcodeInputHeading">
                <h2 id="barcodeInputHeading" class="h5 mb-3">Barcode data</h2>
                <input id="barcodeValue" class="form-control form-control-lg" type="text"
                    autocomplete="off" spellcheck="false" aria-describedby="barcodeStatus">
            </section>
            <section class="barcode-preview" aria-labelledby="barcodePreviewHeading">
                <div class="barcode-paper">
                    <svg id="barcodePreview" aria-label="Generated Code 128 barcode"></svg>
                </div>
            </section>
            <section class="barcode-options" aria-label="Barcode options and history">
                <button class="btn btn-outline-secondary mb-3" type="button" id="presetBarcode" hidden>
                    IBT ZONE 0
                </button>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="showValue" checked>
                    <label class="form-check-label" for="showValue">Print value below barcode</label>
                </div>
                <p id="barcodeStatus" class="barcode-status mb-4" role="status" aria-live="polite"></p>
                <section class="barcode-history" aria-labelledby="barcodeHistoryHeading">
                    <h3 id="barcodeHistoryHeading" class="h6">Recent inputs</h3>
                    <ul id="barcodeHistory" class="barcode-history-list" aria-label="Recent barcode inputs"></ul>
                    <p id="barcodeHistoryEmpty" class="text-secondary mb-0">No past inputs yet.</p>
                    <p id="barcodeHistoryStatus" class="visually-hidden" role="status" aria-live="polite"></p>
                </section>
            </section>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="script/logout.js"></script>
</body>

</html>
