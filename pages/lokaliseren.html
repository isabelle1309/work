<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lokaliseren</title>

    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <link rel="stylesheet" href="../style/lokaliseren.css">

    <script type="module" src="../script/lokaliseren.js"></script>

    <script type="module">
        import { auth } from "../script/firebase.js";
        import { onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../index.html";
            }
        });
    </script>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

        <div class="container">

            <a href="homepage.html" class="navbar-brand">
                <i class="bi bi-house-fill"></i>
                Miau GmbH
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="timetracker.html">
                            <i class="bi bi-clock-history"></i>
                            Time tracker
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html">
                            <i class="bi bi-calendar3"></i>
                            Calendar
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="lokaliseren.html">
                            <i class="bi bi-box-seam"></i>
                            Lokaliseren
                        </a>
                    </li>

                </ul>

                <button class="btn btn-outline-light" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i>
                    Logout
                </button>

            </div>

        </div>

    </nav>

    <main class="container py-5">

        <div class="text-center mb-4">

            <h1>
                <i class="bi bi-disc"></i>
                Lokaliseermeister
            </h1>
        </div>

        <div class="card mb-4">

            <div class="card-body">

                <label class="form-label">
                    Pattern
                </label>

                <div class="row g-2">

                    <div class="col-3">
                        <input
                            type="number"
                            class="form-control form-control-lg text-center pattern-input"
                            id="pattern1"
                            min="1"
                            max="20"
                            inputmode="numeric"
                            placeholder="1"
                            aria-label="Eerste onderdeel"
                            autofocus>
                    </div>

                    <div class="col-3">
                        <input
                            type="number"
                            class="form-control form-control-lg text-center pattern-input"
                            id="pattern2"
                            min="1"
                            max="20"
                            inputmode="numeric"
                            placeholder="2"
                            aria-label="Tweede onderdeel">
                    </div>

                    <div class="col-3">
                        <input
                            type="number"
                            class="form-control form-control-lg text-center pattern-input"
                            id="pattern3"
                            min="1"
                            max="20"
                            inputmode="numeric"
                            placeholder="3"
                            aria-label="Derde onderdeel">
                    </div>

                    <div class="col-3">
                        <input
                            type="number"
                            class="form-control form-control-lg text-center pattern-input"
                            id="pattern4"
                            min="1"
                            max="20"
                            inputmode="numeric"
                            placeholder="4"
                            aria-label="Vierde onderdeel">
                    </div>

                </div>

                <div class="form-text mt-2">
                    ID char count (<code>3 4 2</code>)
                </div>

            </div>

        </div>

        <div class="card mb-4">

            <div class="card-body">

                <label for="identifierInput" class="form-label">
                    Remschijfnummer
                </label>

                <div class="input-group input-group-lg">

                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>

                    <input
                        type="text"
                        id="identifierInput"
                        class="form-control"
                        placeholder="Bijvoorbeeld 100.3375.75"
                        autocomplete="off"
                    >

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        id="clearBtn"
                        title="Wissen">

                        <i class="bi bi-x-lg"></i>

                    </button>

                </div>

            </div>

        </div>


        <!-- Detected format -->
        <div id="formatCard" class="card mb-4 d-none">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center">

                    <div>

                        <h5 class="card-title mb-1">
                            <i class="bi bi-rulers"></i>
                            Formaat
                        </h5>

                        <span class="text-body-secondary">
                            Aantal tekens per onderdeel
                        </span>

                    </div>

                    <div id="formatDisplay"></div>

                </div>

            </div>

        </div>


        <!-- Results -->
        <div id="results"></div>

    </main>


    <!-- Bootstrap -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Logout -->
    <script type="module">

        import { auth } from "../script/firebase.js";

        import { signOut }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


        document.getElementById("logoutBtn").onclick = async () => {

            await signOut(auth);

            window.location.href = "../index.html";

        };

    </script>

</body>

</html>
