<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tally</title>

    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="../style/tally.css">

    <script type="module" src="../script/tally.js"></script>

    <script type="module">
        import { auth } from "../script/firebase.js";
        import { onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "../index.html";
            }
        });
    </script>

</head>

<body>

    <div id="timeTooltip"></div>

    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar">
        <div class="container">
            <a href="homepage.html" class="navbar-brand">
                <i class="bi bi-house-fill"></i> Miau GmbH
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="timetracker.html">
                            <i class="bi bi-clock-history"></i> Time tracker
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="calendar.html">
                            <i class="bi bi-calendar3"></i> Calendar
                        </a>
                    </li>
                </ul>

                <button class="btn btn-outline-light" id="logoutBtn">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </button>

            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <div class="row mb-3">

            <button id="countBtn" class="btn btn-success flex-fill flex-md-none">
                0 hits, 0.00%
            </button>
            <button id="resetBtn" class="btn btn-danger flex-fill flex-md-none">
                evil
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">

        import { auth } from "../script/firebase.js";

        import { signOut }
            from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        document.getElementById("logoutBtn").onclick = async () => {

            await signOut(auth);

            window.location.href = "../index.html";

        };

    </script>

</body>

</html>
